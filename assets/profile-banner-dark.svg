<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Vishnu Prashanth Sridhar — developer, security engineer, researcher</title>
  <desc id="desc">A minimal animated workbench banner. A small carousel cycles through OpenReflex, agent-plane, secchecker, PigeonMQ, and OWASP contributor work.</desc>
  <style>
    .item { opacity: 0; }
    .item-1 { opacity: 1; animation: item1 20s linear infinite; }
    .item-2 { animation: item2 20s linear infinite; }
    .item-3 { animation: item3 20s linear infinite; }
    .item-4 { animation: item4 20s linear infinite; }
    .item-5 { animation: item5 20s linear infinite; }
    .cursor { animation: blink 1.25s steps(1,end) infinite; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    @keyframes item1 { 0%,16% {opacity:1} 20%,96% {opacity:0} 100% {opacity:1} }
    @keyframes item2 { 0%,16% {opacity:0} 20%,36% {opacity:1} 40%,100% {opacity:0} }
    @keyframes item3 { 0%,36% {opacity:0} 40%,56% {opacity:1} 60%,100% {opacity:0} }
    @keyframes item4 { 0%,56% {opacity:0} 60%,76% {opacity:1} 80%,100% {opacity:0} }
    @keyframes item5 { 0%,76% {opacity:0} 80%,96% {opacity:1} 100% {opacity:0} }
    @keyframes blink { 0%,48% {opacity:1} 49%,100% {opacity:0} }
    @keyframes pulse { 0%,100% {opacity:.45} 50% {opacity:1} }
    @media (prefers-reduced-motion: reduce) {
      .item,.cursor,.pulse { animation:none !important; }
      .item { opacity:0; } .item-1 { opacity:1; } .cursor {opacity:1}
    }
  </style>

